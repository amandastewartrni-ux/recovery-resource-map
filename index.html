<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recovery Resource Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([39.63, -79.95], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const GRAPHQL_URL = "http://52.15.188.10/graphql";

  async function fetchResources() {
    const response = await fetch(GRAPHQL_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: `
          query {
            pages {
              list(path: "/resources", limit: 200) {
                path
                title
                meta
              }
            }
          }
        `
      })
    });

    const json = await response.json();
    return json.data.pages.list;
  }

  async function plotResources() {
    const pages = await fetchResources();

    pages.forEach(page => {
      const meta = page.meta;

      const lat = meta?.location?.geo?.latitude;
      const lng = meta?.location?.geo?.longitude;
      if (!lat || !lng) return;

      const name = meta?.resource?.name || page.title;
      const type = meta?.resource?.type || "";

      L.marker([lat, lng])
        .addTo(map)
        .bindPopup(
          `<strong>${name}</strong><br/>
           ${type}<br/>
           <a href="${page.path}"rce</a>`
        );
    });
  }

  plotResources();
</script>


</body>
</html>
