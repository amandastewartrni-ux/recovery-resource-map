<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recovery Resource Map</title>

  <!-- ✅ Leaflet CSS (must be a <link> tag) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- ✅ Leaflet JS (must be a <script src=...> tag) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Create the map centered near Morgantown
  const map = L.map('map').setView([39.63, -79.95], 12);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Add a test marker
  L.marker([39.64, -79.96])
    .addTo(map)
    .bindPopup('<strong>Test Location</strong><br>Map is working!');
</script>

</body>
</html>
